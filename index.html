<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>설문 집계기</title>
</head>
<body>
<script id="tally-logic">
/* 계산 로직: 화면(DOM)을 전혀 쓰지 않는다. test/tally.test.js 가 이 블록을 그대로 꺼내 시험한다. */
var Tally = (function () {
  'use strict';

  // 칸 하나를 판정한다: 'valid'(값 포함) / 'blank' / 'excluded'
  function parseCell(raw) {
    var s = (raw === undefined || raw === null) ? '' : String(raw).trim();
    if (s === '') return { kind: 'blank' };
    if (s === '1' || s === '2' || s === '3' || s === '4' || s === '5') {
      return { kind: 'valid', value: Number(s) };
    }
    return { kind: 'excluded' };
  }

  // 평균: 합 ÷ 개수를 소수 셋째 자리에서 반올림(0.5는 올림)해 둘째 자리까지. 정수 연산으로 부동소수점 오차를 피한다.
  function formatMean(sum, count) {
    if (count === 0) return '-';
    var hundredths = Math.floor((sum * 200 + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = String(hundredths % 100);
    if (frac.length < 2) frac = '0' + frac;
    return whole + '.' + frac;
  }

  // 붙여넣은 텍스트 → { rowCount, items: [{name, valid, mean, blank, excluded}] }
  function tally(text) {
    var lines = String(text).split(/\r\n|\n|\r/);
    // 내용 없는 줄은 건너뛴다(탭이 있는 줄은 응답 줄로 본다).
    lines = lines.filter(function (l) { return l.trim() !== '' || l.indexOf('\t') !== -1; });
    if (lines.length === 0) return { rowCount: 0, items: [] };

    var header = lines[0].split('\t').slice(1); // 첫 열(응답번호)은 집계하지 않는다.
    var items = header.map(function (name, i) {
      var label = name.trim();
      return { name: label === '' ? '(제목 없음 ' + (i + 1) + ')' : label, valid: 0, sum: 0, blank: 0, excluded: 0 };
    });

    var rows = lines.slice(1);
    rows.forEach(function (line) {
      var cells = line.split('\t').slice(1);
      for (var i = 0; i < items.length; i++) {
        var c = parseCell(cells[i]); // 모자란 칸은 undefined → 빈 응답
        if (c.kind === 'valid') { items[i].valid++; items[i].sum += c.value; }
        else if (c.kind === 'blank') items[i].blank++;
        else items[i].excluded++;
      }
    });

    return {
      rowCount: rows.length,
      items: items.map(function (it) {
        return { name: it.name, valid: it.valid, mean: formatMean(it.sum, it.valid), blank: it.blank, excluded: it.excluded };
      })
    };
  }

  return { parseCell: parseCell, formatMean: formatMean, tally: tally };
})();
</script>
</body>
</html>
